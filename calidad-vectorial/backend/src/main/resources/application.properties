spring.application.name=bucher

# Configuración base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bucher_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
#La contraseña que usa nuestra aplicación para generar el token JWT y desencriptar el token recibido
security.jwt.secret=TreintaYDosCaracteresDeContrasenaSinEnieSuperSegura
#Tiempo de expiración del token JWT en milisegundos
security.jwt.expiration-ms=3600000

#Habilita la excepción NoHandlerFoundException para detectar cuando se hace una request a un url inexistente
spring.web.resources.add-mappings=false

# Google
google.oauth.client-id=268241161105-4tcc4uilnh1e040n01e65bver9n1to1t.apps.googleusercontent.com

#Crea la base de datos en caso de no existir
spring.datasource.url=jdbc:mysql://localhost:3306/bucher_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC