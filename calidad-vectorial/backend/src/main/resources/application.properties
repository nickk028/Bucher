spring.application.name=bucher

spring.config.import=optional:file:.env[.properties]

# Configuración base de datos PostgreSQL (Supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
#La contraseña que usa nuestra aplicación para generar el token JWT y desencriptar el token recibido
security.jwt.secret=${JWT_SECRET}
#Tiempo de expiración del token JWT en milisegundos
security.jwt.expiration-ms=3600000

#Habilita la excepción NoHandlerFoundException para detectar cuando se hace una request a un url inexistente
spring.web.resources.add-mappings=false

# Google
google.oauth.client-id=268241161105-4tcc4uilnh1e040n01e65bver9n1to1t.apps.googleusercontent.com